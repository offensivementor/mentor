  <style>
    :root{
      /* POSTER MODE */
      --posterWidth: 1280px; /* было 1080px */
      --posterPad: 64px;
      --posterGap: 20px;

      /* Offensive palette: red + yellow */
      --bg0:#0b0707;
      --bg1:#120a0a;
      --card: rgba(20, 12, 12, .78);

      --stroke: rgba(255, 215, 0, .22);
      --stroke2: rgba(255, 60, 60, .22);

      --text:#fff3e6;
      --muted:#ffd9b0;

      --accent:#ff2d2d;
      --accent2:#ffcc00;

      --shadow: 0 18px 52px rgba(0,0,0,.65);
      --radius: 22px;

      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

      /* headings */
      --hGlow: 0 0 18px rgba(255,45,45,.18), 0 0 18px rgba(255,204,0,.12);
      --hLine: linear-gradient(90deg, rgba(255,45,45,.85), rgba(255,204,0,.85), rgba(255,45,45,.35));

      /* TYPE SCALE (увеличено) */
      --p: 17px;      /* базовый текст */
      --li: 16px;     /* списки */
      --small: 13px;  /* мелкие подписи */
      --lead: 17px;   /* lead */
      --week: 15.5px; /* список внутри недель */
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans";
      color:var(--text);
      background:
        radial-gradient(1100px 650px at 14% 10%, rgba(255,45,45,.18), transparent 60%),
        radial-gradient(900px 600px at 82% 14%, rgba(255,204,0,.14), transparent 62%),
        radial-gradient(900px 600px at 68% 84%, rgba(255,45,45,.10), transparent 65%),
        linear-gradient(180deg, var(--bg0), var(--bg1));

      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* PRINT / PDF */
    @page { margin: 0; }
    @media print{
      .shell{
        width: var(--posterWidth);
        max-width: var(--posterWidth);
        padding: 28px 24px 28px;
      }
      a{ text-decoration: none; }
    }

    /* POSTER LAYOUT */
    .shell{
      width: var(--posterWidth);
      max-width: var(--posterWidth);
      margin: 0 auto;
      padding: var(--posterPad) 26px 80px;
    }

    .section{ margin-top: var(--posterGap); }
    .grid{ margin-top: var(--posterGap); }
    .footer{ margin-top: var(--posterGap); }

    /* ===== HEADINGS SYSTEM ===== */
    .h1{
      font-size: 44px; /* увеличено */
      line-height: 1.05;
      letter-spacing: -.7px;
      margin: 14px 0 12px;
      text-shadow: var(--hGlow);
    }
    .h1 .grad{
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .h1line{
      height: 4px; /* чуть толще */
      width: 100%;
      background: var(--hLine);
      border-radius: 999px;
      margin: 12px 0 0;
      opacity: .95;
    }

    .h2{
      display:flex;
      align-items:center;
      gap: 12px;
      margin: 0 0 12px;
      font-size: 20px; /* увеличено */
      letter-spacing: .2px;
    }
    .h2:before{
      content:"";
      width: 12px;
      height: 22px;
      border-radius: 7px;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      box-shadow: 0 10px 22px rgba(255,45,45,.12);
      border: 1px solid rgba(255,255,255,.10);
      flex: 0 0 auto;
    }
    .h2:after{
      content:"";
      height: 1px;
      flex: 1 1 auto;
      background: linear-gradient(90deg, rgba(255,204,0,.28), rgba(255,45,45,.10), transparent);
      border-radius: 999px;
      margin-left: 6px;
      transform: translateY(1px);
    }

    .capH3{
      text-transform: uppercase;
      color: rgba(255,204,0,.98);
      letter-spacing: .7px;
      font-weight: 950;
      text-shadow: 0 0 14px rgba(255,204,0,.12);
    }

    .h3{
      display:inline-flex;
      align-items:center;
      gap: 10px;
      margin: 0 0 10px;
      font-size: 15px; /* увеличено */
      letter-spacing: .2px;
      color: rgba(255,243,230,.98);
    }
    .h3 .pill.step{
      background: linear-gradient(135deg, rgba(255,45,45,.35), rgba(255,204,0,.22));
      border: 1px solid rgba(255,204,0,.24);
      color: rgba(255,243,230,.98);
      font-weight: 950;
      min-width: 34px;
      text-align: center;
    }

    .h3 .pill{
      font-family: var(--mono);
      font-size: 12px; /* увеличено */
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,204,0,.20);
      background: rgba(0,0,0,.22);
      color: rgba(255,243,230,.92);
    }

    /* ===== HERO ===== */
    .hero{
      position:relative;
      padding: 32px 26px; /* увеличено */
      border: 1px solid var(--stroke);
      background: linear-gradient(135deg, rgba(255,45,45,.14), rgba(255,204,0,.10));
      border-radius: calc(var(--radius) + 10px);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .hero:before{
      content:"";
      position:absolute; inset:-2px;
      background:
        radial-gradient(520px 220px at 14% 12%, rgba(255,45,45,.22), transparent 70%),
        radial-gradient(640px 260px at 86% 18%, rgba(255,204,0,.18), transparent 75%),
        repeating-linear-gradient(90deg, rgba(255,204,0,.05) 0 1px, transparent 1px 26px),
        repeating-linear-gradient(0deg, rgba(255,45,45,.035) 0 1px, transparent 1px 26px);
      opacity:.9;
      pointer-events:none;
      filter: blur(.6px);
    }
    .hero > *{ position:relative; }

    .topline{
      display:flex; flex-wrap:wrap; gap:12px 14px;
      align-items:center; justify-content:space-between;
      margin-bottom: 12px;
    }
    .brand{ display:flex; gap:14px; align-items:center; }
    .logo{
      width:52px; height:52px; border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 14px 34px rgba(255,45,45,.18);
      border: 1px solid rgba(255,255,255,.16);
    }
    .brand .name{
      font-size: 20px;
      margin:0;
      letter-spacing:.2px;
      font-weight: 950;
    }
    .brand .sub{
      margin:3px 0 0;
      font-size: var(--small);
      color: rgba(255,217,176,.92);
    }

    .contacts{
      text-align:right;
      font-size: var(--small);
      color: rgba(255,217,176,.92);
      line-height: 1.35;
    }
    .contacts b{ color: var(--text); font-weight: 950; }
    .tag{
      display:inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,204,0,.28);
      background: rgba(0,0,0,.22);
      margin-top: 7px;
      font-family: var(--mono);
      color: rgba(255,243,230,.95);
      font-size: 13px;
    }

    .lead{
      margin: 0;
      color: rgba(255,217,176,.95);
      font-size: var(--lead);
      line-height: 1.72;
      max-width: 108ch; /* шире */
    }

    .chips{
      display:flex; flex-wrap:wrap;
      gap:12px;
      margin-top: 18px;
    }
    .chip{
      border: 1px solid rgba(255,204,0,.22);
      background: rgba(0,0,0,.18);
      border-radius: 999px;
      padding: 10px 14px; /* больше */
      font-size: 14px; /* больше */
      color: rgba(255,243,230,.95);
      backdrop-filter: blur(6px);
    }
    .chip b{ color:#fff; }

    .btnrow{
      display:flex; flex-wrap:wrap; gap:12px;
      margin-top: 18px;
      align-items:center;
    }
    .btn{
      display:inline-flex;
      align-items:center; justify-content:center;
      padding: 12px 16px; /* больше */
      border-radius: 14px;
      border: 1px solid rgba(255,204,0,.22);
      background: linear-gradient(135deg, rgba(255,45,45,.28), rgba(255,204,0,.18));
      color: var(--text);
      font-weight: 950;
      text-decoration:none;
      box-shadow: 0 16px 38px rgba(0,0,0,.45);
      font-size: 14px;
    }
    .btn.secondary{
      background: rgba(0,0,0,.20);
      border: 1px solid rgba(255,45,45,.22);
      font-weight: 900;
      color: rgba(255,217,176,.95);
    }

    /* LAYOUT */
    .grid{
      display:grid;
      grid-template-columns: 1.06fr .94fr; /* чуть шире правый блок */
      gap: 18px;
    }

    .card{
      border: 1px solid rgba(255,204,0,.18);
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px 22px; /* больше */
      overflow:hidden;
    }

    .list{
      margin: 0;
      padding-left: 20px;
      color: rgba(255,243,230,.96);
      line-height: 1.72;
      font-size: var(--li);
    }
    .list li{ margin: 8px 0; }

    .kpi{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 12px;
    }
    .k{
      padding: 14px 14px;
      border-radius: 16px;
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,204,0,.18);
    }
    .k .n{
      font-size: 22px;
      font-weight: 950;
      letter-spacing: -.2px;
      margin: 0 0 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .k .t{
      margin:0;
      font-size: 13px;
      color: rgba(255,217,176,.92);
      line-height: 1.35;
    }

    .two{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .weekgrid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 12px;
    }
    .week{
      border: 1px solid rgba(255,45,45,.18);
      background: rgba(0,0,0,.16);
      border-radius: 18px;
      padding: 16px 16px;
    }
    .week .wh{
      display:flex; flex-wrap:wrap; gap:10px;
      justify-content:space-between; align-items:center;
      margin-bottom: 8px;
    }
    .week .wh b{
      font-size: 16px;
      letter-spacing: .2px;
      color: rgba(255,204,0,.98);
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(255,204,0,.10);
    }
    .week .num{
      font-family: var(--mono);
      font-size: 13px;
      color: rgba(255,243,230,.88);
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,204,0,.20);
      background: rgba(0,0,0,.22);
    }
    .week ul{
      margin:0;
      padding-left: 20px;
      color: rgba(255,243,230,.96);
      line-height: 1.72;
      font-size: var(--week);
    }
    .week li{ margin: 7px 0; }

    .footer{
      text-align:center;
      color: rgba(255,217,176,.92);
      font-size: 13.5px;
      line-height: 1.55;
    }
    .footer .tagline{
      margin-top: 10px;
      display:inline-block;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,204,0,.18);
      background: rgba(0,0,0,.16);
      font-family: var(--mono);
      color: rgba(255,243,230,.92);
      font-size: 13px;
    }

    @media (max-width: 1320px){
      .shell{ width: 100%; max-width: 100%; padding: 22px 16px 54px; }
    }
    @media (max-width: 1020px){
      .grid{ grid-template-columns: 1fr; }
      .two{ grid-template-columns: 1fr; }
      .contacts{ text-align:left; }
      .h1{ font-size: 34px; }
    }
  
    /* colored list items for week flow */
    .c1{color: rgba(255,204,0,.96);}
    .c2{color: rgba(255,170,80,.96);}
    .c3{color: rgba(255,120,120,.96);}
    .c4{color: rgba(255,230,190,.96);}
</style>
</head>
